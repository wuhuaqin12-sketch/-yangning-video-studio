name: Isolated stable recovery rehearsal
on:
  push:
    branches: [test/intro-main-outro, fix/complete-video-audio-gaps, ui/body-first]
    paths: ['program/**','ci/**','make_release.py','.github/workflows/recovery-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next-features-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: choco install ffmpeg --no-progress -y
      - name: Bundle real Windows media executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force program/tools | Out-Null
          foreach ($n in @('ffmpeg','ffprobe')) {
            Copy-Item "C:/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/$n.exe" "program/tools/$n.exe"
          }
      - run: python -m pip install -r program/requirements.txt
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - name: Fetch and verify pinned original stable archive
        run: python -c "import sys; sys.path.insert(0,'program'); from stable_recovery import preserve_archive; from pathlib import Path; import shutil,tempfile; t=tempfile.TemporaryDirectory(); p=preserve_archive(Path(t.name)); Path('recovery').mkdir(exist_ok=True); shutil.copyfile(p,'recovery/v0.12.11-original.zip'); t.cleanup()"
      - run: python -m unittest sequence_vnext_test simple_ui_test pixel_aspect_test caption_top_test glyph_removal_test decoration_test body_first_ui_test publish_style_test.StyleTests encoding_regression_test
        working-directory: program
      - run: python ci/next_windows_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-windows-evidence
          path: |
            ${{ runner.temp }}/YangNingNextAcceptance/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-package
          path: ${{ runner.temp }}/YangNingNextAcceptance/packages/YangNing_VideoStudio_Windows_0.13.4.zip
          if-no-files-found: error
          retention-days: 30
  restore-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: choco install ffmpeg --no-progress -y
      - run: python -m unittest stable_recovery_test desktop_update_test
        working-directory: program
      - run: python ci/stable_recovery_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-recovery-evidence
          path: |
            ${{ runner.temp }}/YangNingStableRecovery/install/protected/*.json
            ${{ runner.temp }}/YangNingStableRecovery/install/backups/**/manifest.json
          if-no-files-found: warn
