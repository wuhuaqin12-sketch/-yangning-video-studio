name: Verify and publish formal desktop app
on:
  push:
    branches: [main, integrate/simple-0.14.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_release:
        description: '输入 RELEASE 正式发布已验证的安装包'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r program/requirements.txt
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - run: python -m unittest alignment_runtime_test multilingual_test english_regression_test desktop_update_test long_caption_test publish_style_test.StyleTests clean_project_test no_denoise_test voice_clean_test sound_report_test full_listen_test production_test sequence_vnext_test bootstrap_test stable_recovery_test integration_release_test
        working-directory: program
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: choco install ffmpeg --no-progress -y
      - name: Bundle real Windows media executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force program/tools | Out-Null
          foreach ($n in @('ffmpeg','ffprobe')) { Copy-Item "C:/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/$n.exe" "program/tools/$n.exe" }
      - run: python -m pip install -r program/requirements.txt
      - run: python -m pip install playwright
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - name: Real Cantonese SRT alignment on Windows
        run: python ci/cantonese_alignment_smoke.py
      - name: Protect the original stable installer
        run: python -c "import sys,tempfile,shutil;from pathlib import Path;sys.path.insert(0,'program');from stable_recovery import preserve_archive;t=tempfile.TemporaryDirectory();p=preserve_archive(Path(t.name));Path('recovery').mkdir(exist_ok=True);shutil.copyfile(p,'recovery/v0.12.11-original.zip')"
      - name: Windows full function and UI regression
        run: python -m unittest background_layout_test landscape_fixed_test parts_only_test sequence_vnext_test simple_ui_test pixel_aspect_test caption_top_test glyph_removal_test body_first_ui_test publish_style_test.StyleTests encoding_regression_test pause_regression_test multilingual_test clean_project_test desktop_update_test stable_recovery_test bootstrap_test integration_release_test
        working-directory: program
      - name: Five-minute compatible MP4 and actual browser seek
        run: python ci/mobile_playback_windows.py
      - name: Real formal check-update install and stable restore
        run: python ci/formal_candidate_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-acceptance-evidence
          path: |
            ${{ runner.temp }}/YangNingFormalAcceptance/*.png
            ${{ runner.temp }}/YangNingFormalAcceptance/*.json
            ${{ runner.temp }}/YangNingFormalAcceptance/phone-playback-sample.mp4
            ${{ runner.temp }}/YangNingFormalAcceptance/cantonese-alignment.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: formal-candidate-package
          path: ${{ runner.temp }}/YangNingFormalAcceptance/package/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [core-regression, windows-acceptance]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, '[publish-approved]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: formal-candidate-package
          path: ${{ runner.temp }}/YangNingFormalAcceptance/package
      - run: python ci/publish_release.py
