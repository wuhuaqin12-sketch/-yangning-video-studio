name: Test and publish desktop app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r program/requirements.txt
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - run: python -m unittest desktop_update_test long_caption_test publish_style_test clean_project_test no_denoise_test voice_clean_test sound_report_test full_listen_test production_test
        working-directory: program
  windows-install:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set isolated installation directory
        shell: pwsh
        run: '"YANGNING_INSTALL_ROOT=$env:RUNNER_TEMP\YangNingStudio安装测试" >> $env:GITHUB_ENV'
      - run: choco install ffmpeg --no-progress -y
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - run: python program/install_desktop.py --quiet
      - name: Verify installed runtime, version and desktop shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $data=Get-Content (Join-Path $env:YANGNING_INSTALL_ROOT 'current.json') | ConvertFrom-Json
          $expected=(Get-Content release.json | ConvertFrom-Json).version
          if ($data.version -ne $expected) { throw 'Wrong installed version' }
          if (!(Test-Path (Join-Path $env:YANGNING_INSTALL_ROOT 'runtime/Scripts/pythonw.exe'))) { throw 'Missing runtime' }
          if (!(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) '杨宁视频工作室.lnk'))) { throw 'Missing shortcut' }
          $config=Get-Content (Join-Path $env:YANGNING_INSTALL_ROOT 'update_config.json') | ConvertFrom-Json
          if ($config.manifest_url -ne 'https://github.com/wuhuaqin12-sketch/-yangning-video-studio/releases/latest/download/latest.json') { throw 'Missing built-in update URL' }
          & (Join-Path $env:YANGNING_INSTALL_ROOT 'runtime/Scripts/python.exe') -c "import tkinter,numpy,scipy,PIL; print('Windows installation verified')"
      - name: Verify real CPU voice separation and denoise on Windows
        shell: pwsh
        run: '& (Join-Path $env:YANGNING_INSTALL_ROOT "runtime/Scripts/python.exe") ci/separation_smoke.py'
  release:
    needs: [test, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/fetch_fonts.py
      - run: python ci/fetch_noise_model.py
      - run: python ci/publish_release.py
